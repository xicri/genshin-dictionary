name: "Deployment (production)"

on:
  push:
    branches:
      - main
  repository_dispatch:
    types:
      - langdata-update

permissions:
  contents: read
  pull-requests: write

jobs:
  release:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    env:
      NODE_ENV: production
      SERVER_ENV: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@v5
        with:
          install: true
          cache: true

      - run: pnpm install --frozen-lockfile
      # `pnpm build` is not required because it runs on `prepare` process

      - name: "[production] deploy Cloudflare Worker"
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Purge cache of Cloudflare CDN
        run: pnpm run purge-cache
        env:
          CLOUDFLARE_ZONE: ${{ secrets.CLOUDFLARE_ZONE }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
